name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            build_method: native
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            build_method: cross
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            build_method: musl-tools
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (x86_64 Linux)
        if: matrix.build_method == 'musl-tools'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (aarch64 Linux)
        if: matrix.build_method == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.build_method != 'cross'
        run: cargo build --release --features postgres,aws-secrets --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.build_method == 'cross'
        run: cross build --release --features postgres,aws-secrets --target ${{ matrix.target }}

      - name: Create archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="senko-${TAG}-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE}" -C "target/${{ matrix.target }}/release" senko
          if command -v sha256sum &> /dev/null; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: senko-${{ matrix.target }}
          path: |
            senko-*.tar.gz
            senko-*.tar.gz.sha256

  build-web:
    runs-on: ubuntu-latest
    env:
      # Skip installing senko itself: mise.toml pins github:hisamekms/senko
      # to the version we are about to release, which doesn't exist yet.
      MISE_DISABLE_TOOLS: github:hisamekms/senko
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web tarball
        run: mise run web:dist

      - name: Upload web tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: senko-web
          path: |
            dist/senko-web-*.tar.gz
            dist/senko-web-*.tar.gz.sha256

  release:
    needs: [build, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "${TAG}" \
            --generate-notes \
            senko-v*.tar.gz senko-v*.tar.gz.sha256 \
            senko-web-*.tar.gz senko-web-*.tar.gz.sha256
