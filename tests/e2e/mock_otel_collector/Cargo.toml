[package]
name = "mock-otel-collector"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "mock-otel-collector"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
prost = "0.14"
opentelemetry-proto = { version = "0.31", features = ["gen-tonic", "logs", "trace"] }
serde_json = "1"
anyhow = "1"
