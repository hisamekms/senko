[workspace]
members = [".", "tests/e2e/mock_otel_collector"]

[package]
name = "senko"
version = "0.43.0"
edition = "2024"

[[bin]]
name = "senko"
path = "src/main.rs"

[features]
aws-secrets = ["dep:aws-sdk-secretsmanager", "dep:aws-config"]
postgres = ["dep:sqlx"]
# Build-time switch that enables developer-only commands such as `senko dev seed`.
# This feature is intentionally NOT enabled by default; release binaries built via
# `cargo install senko` must not contain dev-only subcommands.
dev-tools = []

[dependencies]
clap = { version = "4.5.60", features = ["derive", "env"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
chrono = "0.4.44"
axum = "0.8"
axum-extra = { version = "0.12", features = ["query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
ammonia = "4"
async-trait = "0.1"
jsonwebtoken = "10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sha2 = "0.11"
subtle = "2"
thiserror = "2"
zeroize = "1"
aws-sdk-secretsmanager = { version = "1", optional = true }
aws-config = { version = "1", optional = true, features = ["behavior-version-latest"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
percent-encoding = "2"
oauth2 = "5"
base64 = "0.22"
keyring = { version = "3", features = ["linux-native", "apple-native"] }
open = "5"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "trace", "logs"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "trace", "logs"] }
opentelemetry-stdout = { version = "0.31", features = ["trace", "logs"] }
opentelemetry-appender-tracing = "0.31"
tracing-opentelemetry = "0.32"
lru = "0.12"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
postgresql_embedded = { version = "0.20", default-features = false, features = ["rustls", "theseus"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "trace", "logs", "testing"] }
