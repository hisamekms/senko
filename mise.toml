[env]
_.path = ["./scripts/bin"]
_.file = ".env"

[tools]
rust = "latest"
gh = "latest"
"github:hisamekms/senko" = "0.43.0"
"cargo:mdbook" = "latest"
"cargo:mdbook-mermaid" = "latest"

[tasks.build]
description = "Build senko binary (with dev-tools for the e2e seeder)"
run = "cargo build -q --bin senko --features dev-tools"

[tasks.test]
description = "Run unit tests"
run = "cargo test"

[tasks.build-pg]
description = "Build senko binary with postgres feature (and dev-tools for the e2e seeder)"
run = "cargo build -q --bin senko --example pg_test_server --features postgres,dev-tools"

[tasks.build-mock-otel-collector]
description = "Build embedded OTLP mock collector for e2e"
run = "cargo build -q -p mock-otel-collector"

[tasks."e2e:sqlite"]
description = "Run e2e tests with SQLite backend"
depends = ["build", "build-mock-otel-collector"]
run = "bash tests/e2e/run.sh"

[tasks."e2e:postgres"]
description = "Run e2e tests with PostgreSQL backend"
depends = ["build-pg", "build-mock-otel-collector"]
run = "bash tests/e2e/run.sh --backend=postgres"

[tasks.e2e]
description = "Run e2e tests with all backends"
depends = ["e2e:sqlite", "e2e:postgres"]

[tasks.dev]
description = "Run locally built senko binary"
depends = ["build"]
run = "./target/debug/senko"

[tasks.docs]
description = "Serve docs/ via mdbook in background. Writes .local/docs.pid + .local/docs.log. Pass --port <N> to override the default 3000."
run = "docs serve"

[tasks."docs:stop"]
description = "Stop the backgrounded mdbook docs server"
run = "docs stop"

[tasks."web:dev"]
description = "Start senko serve (dev bypass) + web Vite dev server in background. See web/README.md."
depends = ["build"]
run = "web-dev start"

[tasks."web:dev:stop"]
description = "Stop the web dev stack started by `mise run web:dev`"
run = "web-dev stop"

[tasks."web:dev:reset"]
description = "Wipe + reseed the dev DB, then start the web dev stack"
depends = ["build"]
run = "web-dev reset"

[tasks."web:dev:status"]
description = "Show status of the web dev stack"
run = "web-dev status"

[tasks."web:e2e"]
description = "Run the Playwright E2E suite for the web app. See web/README.md."
depends = ["build"]
run = "cd web && npm run e2e"

[tasks."web:e2e:install"]
description = "One-time install of Playwright browser binaries (chromium)."
run = "cd web && npm run e2e:install"

[tasks."web:e2e:ui"]
description = "Run the Playwright E2E suite in headed UI mode."
depends = ["build"]
run = "cd web && npm run e2e:ui"

[tasks."web:e2e:report"]
description = "Open the most recent Playwright HTML report."
run = "cd web && npm run e2e:report"

[tasks."web:dist"]
description = "Build senko-web tarball (dist/senko-web-${VERSION}.tar.gz) for AWS Lambda."
run = "build-web-tarball"
